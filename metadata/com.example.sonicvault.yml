Name: SonicVault
Summary: Offline music player with covers, lyrics, and playlists
Description: |
  SonicVault is an offline-first music player. It plays music from your
  local storage - no streaming, no subscriptions.

  Features include custom cover art, playlists, synchronized lyrics (LRC),
  and browse-by-genre/artist/album views. A 10-band equalizer and M3U
  playlist export are on the workbench.
