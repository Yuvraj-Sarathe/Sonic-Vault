Name: SonicVault
Summary: Offline music player with covers, lyrics, and playlists
Description: |
  SonicVault is an offline-first music player. It plays music from your
  local storage - no streaming, no subscriptions.

  Features include custom cover art, playlists with M3U export,
  synchronized lyrics (LRC), a 10-band equalizer, volume normalization,
  and browse-by-genre/artist/album views.
